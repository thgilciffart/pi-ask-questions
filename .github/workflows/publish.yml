name: Publish to npm

# Runs when a GitHub release is published, or manually from the Actions tab.
# Bump the version in package.json and commit first; this workflow publishes it.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets npm verify this workflow via trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      # npm ci when a package-lock.json exists, npm install otherwise (bun.lock repos)
      - run: npm ci || npm install
      # prepublishOnly (check + test) runs automatically before publish
      - run: npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }} # only needed without trusted publishing
